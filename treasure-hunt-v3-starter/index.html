<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>황제의부활 보물찾기 V3 · 디자인 검토</title><style>*{box-sizing:border-box}body{margin:0;background:#101b2c;color:#fff;font-family:system-ui,sans-serif}header{position:sticky;top:0;background:#101b2cf2;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:3}select,button{font-size:14px;border:1px solid #a68c50;border-radius:8px;background:#24354d;color:white;padding:9px;max-width:60vw}main{display:flex;justify-content:center;padding:10px 10px 90px}img{width:100%;max-width:430px;height:auto;object-fit:contain;box-shadow:0 8px 30px #0008}footer{position:fixed;bottom:0;left:0;right:0;background:#101b2cf5;display:flex;justify-content:space-around;padding:10px;gap:12px}footer button{flex:1}small{display:block;color:#dbc89e;text-align:center;padding:8px}</style></head><body><header><strong>보물찾기 V3</strong><select id="page" aria-label="페이지 선택"></select></header><small>확정 디자인 29장 검토용 · 실제 기능은 개발 중</small><main><img id="screen" alt="디자인 시안"></main><footer><button id="prev">◀ 이전</button><button id="next">다음 ▶</button></footer><script>const names=["메인", "앞면 촬영", "앞면 확인", "뒷면 촬영", "뒷면 확인", "AI 감정 분석", "AI 감정서", "보물장터", "상품 상세", "결제", "경매 목록", "경매 등록", "경매 등록 완료", "입찰 완료", "낙찰 완료", "세계의 보물 소개", "세계의 보물 목록", "세계의 보물 상세", "보물헌터 상세", "오늘의 보물", "이벤트 상세", "마이페이지", "쪽지함", "내 포인트", "문의 내역", "알림 설정", "계정 설정", "경매 상세", "보물헌터 메인"],images=["screens/01.jpg", "screens/02.png", "screens/03.png", "screens/04.png", "screens/05.png", "screens/06.png", "screens/07.jpg", "screens/08.png", "screens/09.png", "screens/10.png", "screens/11.png", "screens/12.png", "screens/13.png", "screens/14.png", "screens/15.png", "screens/16.png", "screens/17.png", "screens/18.png", "screens/19.png", "screens/20.png", "screens/21.png", "screens/22.png", "screens/23.png", "screens/24.png", "screens/25.png", "screens/26.png", "screens/27.png", "screens/28.png", "screens/29.png"];let current=0;const sel=document.getElementById('page'),img=document.getElementById('screen');names.forEach((n,i)=>sel.add(new Option(`${i+1}. ${n}`,i)));function show(i){current=(i+names.length)%names.length;sel.value=current;img.src=images[current];img.alt=names[current];location.hash=String(current+1)}sel.onchange=()=>show(+sel.value);document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);show(Math.max(0,Math.min(names.length-1,(parseInt(location.hash.slice(1))||1)-1)));</script></body></html>
