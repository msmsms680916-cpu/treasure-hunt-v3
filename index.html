<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>황제의부활 보물찾기 | 모바일 웹</title><style>*{box-sizing:border-box}body{margin:0;background:#101b2c;color:#fff;font-family:system-ui,sans-serif}header{position:sticky;top:0;background:#101b2cf2;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:3}select,button{font-size:14px;border:1px solid #a68c50;border-radius:8px;background:#24354d;color:white;padding:9px;max-width:60vw}main{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 10px 30px}img{width:100%;max-width:430px;height:auto;object-fit:contain;box-shadow:0 8px 30px #0008}footer{position:fixed;bottom:0;left:0;right:0;background:#101b2cf5;display:flex;justify-content:space-around;padding:10px;gap:12px}footer button{flex:1}small{display:block;color:#dbc89e;text-align:center;padding:8px}</style></head><body><header><strong>황제의부활 <em>보물찾기</em></strong><select id="page" aria-label="페이지 선택"></select></header><small>실제 결제 및 AI 감정은 아직 연동되지 않았습니다.</small><main><img id="screen" alt="디자인 시안"></main><footer><button id="prev">← 뒤로가기</button><button id="next">⌂ 홈으로</button></footer><script>
const names=["메인", "앞면 촬영", "앞면 확인", "뒷면 촬영", "뒷면 확인", "AI 감정 분석", "AI 감정서", "보물장터", "상품 상세", "결제", "경매 목록", "경매 등록", "경매 등록 완료", "입찰 완료", "낙찰 완료", "세계의 보물 소개", "세계의 보물 목록", "세계의 보물 상세", "보물헌터 메인", "의뢰게시판", "보물헌터 상세", "오늘의 보물", "이벤트 상세", "마이페이지", "쪽지함", "내 포인트", "문의 내역", "알림 설정", "계정 설정", "경매 상세"];
const images=["treasure-hunt-v3-starter/screens/01.jpg", "treasure-hunt-v3-starter/screens/02.png", "treasure-hunt-v3-starter/screens/03.png", "treasure-hunt-v3-starter/screens/04.png", "treasure-hunt-v3-starter/screens/05.png", "treasure-hunt-v3-starter/screens/06.png", "treasure-hunt-v3-starter/screens/07.jpg", "treasure-hunt-v3-starter/screens/08.png", "treasure-hunt-v3-starter/screens/09.png", "treasure-hunt-v3-starter/screens/10.png", "treasure-hunt-v3-starter/screens/11.png", "treasure-hunt-v3-starter/screens/12.png", "treasure-hunt-v3-starter/screens/13.png", "treasure-hunt-v3-starter/screens/14.png", "treasure-hunt-v3-starter/screens/15.png", "treasure-hunt-v3-starter/screens/16.png", "treasure-hunt-v3-starter/screens/17.png", "treasure-hunt-v3-starter/screens/18.png", "treasure-hunt-v3-starter/screens/29.png", "screens/file_000000008d388206ae90217561ba1ff9.png", "treasure-hunt-v3-starter/screens/19.png", "treasure-hunt-v3-starter/screens/20.png", "treasure-hunt-v3-starter/screens/21.png", "treasure-hunt-v3-starter/screens/22.png", "treasure-hunt-v3-starter/screens/23.png", "treasure-hunt-v3-starter/screens/24.png", "treasure-hunt-v3-starter/screens/25.png", "treasure-hunt-v3-starter/screens/26.png", "treasure-hunt-v3-starter/screens/27.png", "treasure-hunt-v3-starter/screens/28.png"];
const formImage="screens/file_00000000395c8209827082c01d7a8f4e.png";
let current=0, formOpen=false;
const sel=document.getElementById('page'),img=document.getElementById('screen');
const main=document.querySelector('main');main.style.position='relative';
const registeredPanel=document.createElement('section');registeredPanel.id='registered-list';registeredPanel.setAttribute('aria-live','polite');main.insertBefore(registeredPanel,img);
const write=document.createElement('button');write.textContent='✎ 글쓰기';write.setAttribute('aria-label','의뢰 등록 글쓰기');
write.style.cssText='position:absolute;top:20px;right:max(12px,calc((100% - 430px)/2 + 12px));z-index:2;background:#24354d;border:2px solid #d3b66c;cursor:pointer';
main.appendChild(write);
const back=document.createElement('button');back.textContent='← 의뢰게시판으로';back.style.cssText='position:absolute;top:20px;left:max(12px,calc((100% - 430px)/2 + 12px));z-index:2;cursor:pointer';main.appendChild(back);
names.forEach((n,i)=>sel.add(new Option(`${i+1}. ${n}`,i)));
function render(){sel.value=current;img.src=formOpen?formImage:images[current];img.alt=formOpen?'의뢰등록폼':names[current];write.hidden=formOpen||current!==19;back.hidden=!formOpen;location.hash=formOpen?'20-write':String(current+1)}
function show(i){current=(i+names.length)%names.length;formOpen=false;render()}
write.onclick=()=>{formOpen=true;render()};back.onclick=()=>{formOpen=false;render()};
sel.onchange=()=>show(+sel.value);
document.getElementById('prev').onclick=()=>formOpen?(formOpen=false,render()):show(current-1);
document.getElementById('next').onclick=()=>show(0);
const initial=parseInt(location.hash.slice(1))||1;show(Math.max(0,Math.min(names.length-1,initial-1)));
</script>
<style>
#registered-list{width:min(430px,100%);margin:0 auto;color:#162840;background:#fff;display:none;overflow:hidden}#registered-list .shot-part{position:relative;width:100%;overflow:hidden;background:white}#registered-list .shot-part img{position:absolute;left:0;top:0;width:100%;max-width:none;height:auto;box-shadow:none;display:block}#registered-list .shot-part.bottom img{top:auto;bottom:0}#registered-list .new-entries{background:#f8fafc;padding:8px 9px 12px}#registered-list .entry-caption{color:#34547c;font-size:12px;font-weight:700;margin:0 0 8px;padding:2px 3px}#registered-list .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}#registered-list article{cursor:pointer;border:1px solid #e0e5eb;border-radius:10px;overflow:hidden;background:#fff;min-width:0;box-shadow:0 2px 4px #172c4810}#registered-list article img{display:block;width:100%;height:110px;object-fit:contain;background:#f4f6f9;box-shadow:none}#registered-list article .details{padding:7px;font-size:12px;overflow-wrap:anywhere;line-height:1.45}#registered-list article b{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:13px;color:#183b68}#registered-list article .desc{color:#7a8795;font-size:11px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;margin:3px 0}#registered-list article .price{color:#d13742;font-size:14px;font-weight:800}#registered-list.hunter .cards{grid-template-columns:1fr}#registered-list.hunter article{display:flex;align-items:center;min-height:95px}#registered-list.hunter article img,#registered-list.hunter article .no-photo{width:112px;height:92px;flex-shrink:0;object-fit:cover}#registered-list.hunter article .details{flex:1;padding:10px}#registered-list .no-photo{height:110px;background:#f2f4f8;display:grid;place-items:center;color:#65748a;font-size:12px}#registered-list .shot-part.bottom{border-top:1px solid #e9edf2}
#demo-actions{position:sticky;bottom:68px;z-index:4;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;background:#101b2cf2;padding:8px;max-width:650px;margin:auto}#demo-actions button{font-size:12px;padding:8px;cursor:pointer}#demo-modal{display:none;position:fixed;inset:0;background:#081322ef;z-index:20;overflow:auto;padding:20px}#demo-modal.active{display:block}#demo-box{background:#fff;color:#14233b;max-width:430px;margin:5vh auto;padding:20px;border-radius:16px}#demo-box input,#demo-box textarea{display:block;width:100%;border:1px solid #b4bdc7;background:white;color:#111;padding:12px;margin:9px 0;border-radius:8px}#demo-box button{margin:4px;background:#24354d;color:white}#demo-box button:disabled{opacity:.4}#demo-box progress{accent-color:#2879c9}#demo-toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:30;background:#ffefbc;color:#1c2940;padding:10px 14px;border-radius:8px;display:none}
</style>
<div id="demo-actions"></div><div id="demo-modal"><div id="demo-box"><button id="demo-close">✕ 닫기</button><div id="demo-content"></div></div></div><div id="demo-toast"></div>
<script>
(()=>{
const actions=document.getElementById('demo-actions'),modal=document.getElementById('demo-modal'),content=document.getElementById('demo-content');
const save=(k,v)=>localStorage.setItem('treasure-demo-'+k,JSON.stringify(v));
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem('treasure-demo-'+k))??d}catch{return d}};
const safe=t=>String(t).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=t=>{let e=document.getElementById('demo-toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2000)};
function open(h){content.innerHTML=h;modal.classList.add('active')}
function close(){modal.classList.remove('active')}
document.getElementById('demo-close').onclick=close;
function goto(n){close();show(n-1);draw()}
function add(t,f){let b=document.createElement('button');b.textContent=t;b.onclick=f;actions.appendChild(b)}
function capture(side,next){open('<h3>'+side+' 사진 촬영 또는 앨범 선택</h3><input id="pic" type="file" accept="image/*" capture="environment"><img id="picpreview" style="width:100%;max-height:320px;object-fit:contain"><button id="picok">사진 확인</button>');document.getElementById('pic').onchange=e=>{let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{document.getElementById('picpreview').src=reader.result;try{save(side+'-photo',reader.result)}catch{toast('사진 미리보기 완료')}};reader.readAsDataURL(f)};document.getElementById('picok').onclick=()=>{if(!document.getElementById('pic').files.length)return toast('사진을 선택하세요');goto(next)}}
function entry(type){let entries=load(type,[]);open('<h3>'+type+' 등록</h3><input id="entry-title" placeholder="제목"><textarea id="entry-desc" placeholder="설명"></textarea><label>상품 사진 (선택)</label><input id="entry-photo" type="file" accept="image/*"><input id="entry-price" placeholder="가격 (선택)" type="number"><button id="entry-save">등록하기</button><h4>등록 내역</h4>'+entries.map(e=>'<p>✓ '+safe(e.title)+'</p>').join(''));document.getElementById('entry-save').onclick=()=>{let title=document.getElementById('entry-title').value.trim();if(!title)return toast('제목을 입력하세요');const item={title,desc:document.getElementById('entry-desc').value,price:document.getElementById('entry-price').value,photo:load('앞면-photo',''),id:Date.now()};const file=document.getElementById('entry-photo').files[0];const finish=()=>{entries.unshift(item);try{save(type,entries)}catch(e){item.photo='';try{save(type,entries)}catch(e2){return toast('저장 공간이 부족합니다')}}close();if(type==='보물')goto(8);else if(type==='경매')goto(11);else goto(20);window.scrollTo(0,0);toast('등록 완료 · 목록 최상단에 표시')};if(file){const reader=new FileReader();reader.onload=()=>{const photo=new Image();photo.onload=()=>{const canvas=document.createElement('canvas');const ratio=Math.min(1,640/Math.max(photo.width,photo.height));canvas.width=Math.max(1,Math.round(photo.width*ratio));canvas.height=Math.max(1,Math.round(photo.height*ratio));canvas.getContext('2d').drawImage(photo,0,0,canvas.width,canvas.height);item.photo=canvas.toDataURL('image/jpeg',0.7);finish()};photo.onerror=finish;photo.src=reader.result};reader.onerror=finish;reader.readAsDataURL(file)}else finish()}}
function listings(type){let list=load(type,[]);open('<h3>'+type+' 등록 상품</h3>'+(list.length?list.map(x=>'<div style="border-bottom:1px solid #ddd;padding:10px 0">'+(x.photo?'<img src="'+x.photo+'" style="width:95px;height:95px;object-fit:contain;float:right">':'')+'<b>'+safe(x.title)+'</b><p>'+safe(x.desc||'')+'</p><p>'+safe(x.price||'')+'원</p><div style="clear:both"></div></div>').join(''):'<p>아직 등록한 상품이 없습니다.</p>')+'<button id="listing-new">새로 등록</button>');document.getElementById('listing-new').onclick=()=>entry(type)}
function message(){let list=load('messages',[]);open('<h3>거래 문의 · 쪽지</h3><div style="max-height:30vh;overflow:auto">'+list.map(x=>'<p>✉ '+safe(x)+'</p>').join('')+'</div><textarea id="message-text" placeholder="메시지 입력"></textarea><button id="message-send">➤ 전송</button>');document.getElementById('message-send').onclick=()=>{let v=document.getElementById('message-text').value.trim();if(!v)return toast('내용을 입력하세요');list.push(v);save('messages',list);message();toast('쪽지 저장 완료')}}
function login(){open('<h3>시연용 로그인</h3><input id="nick" placeholder="닉네임"><button id="nick-save">시작하기</button><p>실제 카카오/구글 인증은 연동되지 않았습니다.</p>');document.getElementById('nick-save').onclick=()=>{save('nickname',document.getElementById('nick').value||'시연회원');close();toast('시연 로그인 완료')}}
function share(){if(navigator.share)navigator.share({title:'황제의부활 보물찾기',url:location.href}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(location.href).then(()=>toast('링크 복사 완료'));else toast('공유 기능을 지원하지 않는 브라우저입니다')}
function auctionDetail(item){
 const id=String(item.id??item.title), base=Math.max(0,Number(item.price)||0);
 const bids=load('auction-bids-'+id,[]);
 const highest=Math.max(base,...bids.map(b=>Number(b.amount)||0));
 const photo=item.photo?'<img alt="경매 상품 사진" src="'+item.photo+'" style="display:block;width:100%;max-height:240px;object-fit:contain;border-radius:10px;background:#f4f6f9;box-shadow:none">':'<div style="background:#f4f6f9;border-radius:10px;padding:55px 12px;text-align:center;color:#65748a">등록된 사진 없음</div>';
 open('<div class="auction-detail"><h3 style="color:#183b68;margin:8px 0 12px">경매 상품 상세</h3>'+photo+'<h3 style="margin:14px 0 5px">'+safe(item.title)+'</h3><p style="color:#65748a;white-space:pre-wrap">'+safe(item.desc||'')+'</p><div style="background:#f7f9fc;border:1px solid #e2e7ee;border-radius:12px;padding:13px;line-height:1.9"><div>시작가 <strong>'+base.toLocaleString('ko-KR')+'원</strong></div><div>현재 최고 입찰가 <strong style="color:#c43b45">'+highest.toLocaleString('ko-KR')+'원</strong></div><div>남은 시간 <strong>경매 기간 미설정</strong></div><div>입찰 횟수 <strong>'+bids.length+'회</strong></div></div><h4 style="margin-bottom:8px">입찰하기 (시연)</h4><input id="auction-bid-amount" type="number" inputmode="numeric" min="'+(highest+1)+'" step="1" placeholder="'+(highest+1000).toLocaleString('ko-KR')+'원 이상 입력"><button id="auction-bid-submit">입찰 확인</button><button id="auction-inquiry">거래 문의</button><div id="auction-bid-history" style="margin-top:14px;font-size:13px;color:#52657c">'+(bids.length?'<b>입찰 내역</b>'+bids.slice(0,10).map(b=>'<p style="margin:5px 0">'+Number(b.amount).toLocaleString('ko-KR')+'원 · '+safe(b.date||'')+'</p>').join(''):'아직 입찰 내역이 없습니다.')+'</div><p style="font-size:12px;color:#65748a">시연 기능으로 실제 경매·결제는 진행되지 않습니다.</p></div>');
 document.getElementById('auction-inquiry').onclick=message;
 document.getElementById('auction-bid-submit').onclick=()=>{
 const amount=Number(document.getElementById('auction-bid-amount').value);
 if(!Number.isSafeInteger(amount)||amount<=highest)return toast('현재 최고 입찰가보다 높은 금액을 입력하세요');
 const next=[{amount,date:new Date().toLocaleString('ko-KR')},...bids];
 try{save('auction-bids-'+id,next)}catch(e){return toast('입찰 저장 실패: 저장 공간을 확인하세요')}
 auctionDetail(item);toast(amount.toLocaleString('ko-KR')+'원 입찰 완료');
 };
}
function renderRegistered(){
 const panel=document.getElementById('registered-list');
 const kind=current===7?'보물':current===10?'경매':current===19?'헌터 의뢰':null;
 const items=kind?load(kind,[]):[];
 if(!kind||!items.length||formOpen){panel.style.display='none';panel.innerHTML='';img.style.display='block';return}
 img.style.display='none';panel.style.display='block';panel.className=kind==='헌터 의뢰'?'hunter':'';
 const cut=kind==='보물'?652:kind==='경매'?665:kind==='헌터 의뢰'?600:650;
 const src=images[current];
 const top='<div class="shot-part top" style="aspect-ratio:864 / '+cut+'"><img src="'+src+'" alt="기존 화면 상단"></div>';
 const bottom='<div class="shot-part bottom" style="aspect-ratio:864 / '+(1536-cut)+'"><img src="'+src+'" alt="기존 목록 디자인"></div>';
 const cards=items.map((x,i)=>'<article data-item-index="'+i+'" tabindex="0" role="button" aria-label="등록 항목 상세 보기">'+(x.photo?'<img alt="등록 사진" src="'+x.photo+'">':'<div class="no-photo">사진 없음</div>')+'<div class="details"><b>'+safe(x.title)+'</b><div class="desc">'+safe(x.desc||'')+'</div>'+(x.price?'<div class="price">'+Number(x.price).toLocaleString('ko-KR')+'원</div>':'')+'</div></article>').join('');
 panel.innerHTML=top+'<section class="new-entries"><div class="entry-caption">새로 등록된 '+(kind==='헌터 의뢰'?'의뢰':kind==='경매'?'경매':'보물')+' · '+items.length+'건</div><div class="cards">'+cards+'</div></section>'+bottom;
 panel.querySelectorAll('article').forEach(card=>{const detail=()=>{const x=items[Number(card.dataset.itemIndex)];if(kind==='경매'){auctionDetail(x);return}open('<h3>'+safe(x.title)+'</h3>'+(x.photo?'<img src="'+x.photo+'" style="width:100%;max-height:260px;object-fit:contain">':'')+'<p>'+safe(x.desc||'')+'</p><p>'+safe(x.price||'')+(x.price?'원':'')+'</p><button id="detail-message">거래 문의</button>');document.getElementById('detail-message').onclick=message};card.onclick=detail;card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();detail()}}});
}

function draw(){actions.innerHTML='';let n=current+1;renderRegistered();
if(n===1){add('로그인',login);add('보물 촬영',()=>goto(2));add('보물장터',()=>goto(8));add('경매',()=>goto(11));add('세계의 보물',()=>goto(16));add('보물헌터',()=>goto(19));add('오늘의 보물',()=>goto(22));add('마이페이지',()=>goto(24))}
if(n===2||n===3)add('앞면 촬영 / 앨범',()=>capture('앞면',4));
if(n===4||n===5)add('뒷면 촬영 / 앨범',()=>capture('뒷면',6));
if(n===6){add('AI 감정 시작',()=>{open('<h3>코코가 보물을 분석하고 있어요</h3><p id="progress-label">감정 중...</p><progress id="progress-bar" max="100" value="0" style="width:100%;height:22px"></progress><button id="progress-finish" disabled>감정서 보기</button>');let pct=0;let timer=setInterval(()=>{if(!document.getElementById('progress-bar')||!modal.classList.contains('active')){clearInterval(timer);return}pct=Math.min(100,pct+10);document.getElementById('progress-bar').value=pct;document.getElementById('progress-label').textContent=pct<40?'감정 중...':pct<75?'시세 분석 중...':pct<100?'상태 분석 중...':'분석 완료';if(pct===100){clearInterval(timer);document.getElementById('progress-finish').disabled=false}},180);document.getElementById('progress-finish').onclick=()=>goto(7)});add('감정서 보기 (시연)',()=>goto(7))}
if(n===7){add('감정서 저장',()=>{save('appraisal',{saved:true});toast('감정서 저장 완료')});add('공유',share);add('보물 등록',()=>entry('보물'));add('경매 등록',()=>entry('경매'))}
if([8,9].includes(n)){add('내 등록상품 확인',()=>listings('보물'));add('상품 상세',()=>goto(9));add('거래 문의',message);add('결제 시연',()=>goto(10));add('공유',share)}
if(n===10)add('시연 결제 완료',()=>{save('purchase',{complete:true});goto(24);toast('시연 결제 완료')});
