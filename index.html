const samples=[{id:'s1',title:'1970년 500원 희귀 주화',price:150000,emoji:'🪙',type:'보물'},{id:'s2',title:'한국은행 1,000원 (세종대왕)',price:120000,emoji:'💵',type:'보물'},{id:'s3',title:'옛 도자기',price:85000,emoji:'🏺',type:'보물'}],auctions=[{id:'a1',title:'1966년 희귀 주화',price:170000,emoji:'🪙',type:'경매'},{id:'a2',title:'기념 주화 세트',price:80000,emoji:'🏅',type:'경매'}];function items(t){return [...read(t,[]).map(x=>({...x,type:t})),...(t==='경매'?auctions:samples)]}function photo(x){return x.photo?`<img src="${x.photo}" alt="보물 사진">`:x.emoji||'🪙'}function card(x){return `<button class="item" onclick="openItem('${x.type}','${x.id}')"><div class="pic">${photo(x)}</div><div class="info"><b>${esc(x.title)}</b><span class="price">${Number(x.price||0).toLocaleString()}원</span></div></button>`}function openItem(t,id){selected=items(t).find(x=>String(x.id)===String(id))||read('헌터 의뢰',[]).find(x=>String(x.id)===String(id));if(!selected)return;go(t==='경매'?'auctionDetail':t==='헌터 의뢰'?'hunterDetail':'detail')}
function picker(side,mode='album'){const input=$('photoInput');if(!input)return toast('사진 선택창을 다시 열어 주세요');if(mode==='camera')input.setAttribute('capture','environment');else input.removeAttribute('capture');input.onchange=e=>{const f=e.target.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),r=Math.min(1,900/Math.max(im.width,im.height));c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);if(side==='front')front=c.toDataURL('image/jpeg',.7);else back=c.toDataURL('image/jpeg',.7);go(side==='front'?'frontConfirm':'backConfirm')};im.src=reader.result};reader.readAsDataURL(f)};input.click()}
function saveItem(){const name=$('name').value.trim();if(!name)return toast('제목을 입력하세요');const obj={id:Date.now(),title:name,desc:$('desc').value,price:Number($('price').value)||0,photo:front||'',region:$('region')?.value||'전국'};const f=$('upload').files[0];const done=()=>{const arr=read(type,[]);arr.unshift(obj);if(save(type,arr)){go(type==='경매'?'auctions':type==='보물'?'market':'hunterList');toast('등록 완료')}};if(!f)return done();const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),scale=Math.min(1,650/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);obj.photo=c.toDataURL('image/jpeg',.65);done()};im.src=r.result};r.readAsDataURL(f)}
function share(){if(navigator.share)navigator.share({title:'보물찾기',url:location.href}).catch(()=>{});else navigator.clipboard?.writeText(location.href).then(()=>toast('링크 복사 완료'))}function bid(){const n=Number($('bid').value),k='auction-bids-'+selected.id,arr=read(k,[]),top=Math.max(Number(selected.price)||0,...arr.map(x=>x.amount));if(n<=top)return toast('현재가보다 높은 금액을 입력하세요');arr.push({amount:n});save(k,arr);toast('입찰 기록 완료');draw()}function send(){const v=$('message').value.trim();if(!v)return toast('내용을 입력하세요');save('messages',[...read('messages',[]),v]);draw();toast('쪽지 저장 완료')}
function content(){let h='';switch(page){
case 'front':case 'back':h=title(page==='front'?'보물 앞면 촬영':'보물 뒷면 촬영')+`<div class="card"><h2>📸 ${page==='front'?'앞면':'뒷면'} 촬영하기</h2><p class="muted">휴대폰 카메라 또는 앨범에서 선택하세요.</p><input type="file" id="photoInput" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"><button class="primary" onclick="picker('${page}','camera')">📷 카메라로 촬영하기</button><button class="secondary" onclick="picker('${page}','album')">🖼 앨범에서 선택하기</button></div>`;break;
case 'frontConfirm':case 'backConfirm':{let f=page==='frontConfirm';h=title(f?'앞면 사진 확인':'뒷면 사진 확인')+`<div class="card"><img class="preview" src="${f?front:back}">${btn('다시 선택',f?'front':'back','light')}${btn(f?'뒷면 촬영하기':'AI 감정하기',f?'back':'analyzing')}</div>`;break}
case 'analyzing':h=title('코코 AI 감정')+`<div class="card" style="text-align:center"><div style="font-size:70px">🤖</div><h2>감정 중 · 시세 분석 중 · 상태 분석 중</h2><p class="sample">실제 AI 연결 전으로 예시 감정서를 보여드립니다.</p>${btn('감정서 확인하기','certificate')}</div>`;break;
case 'certificate':h=title('코코 AI 감정서')+`<div class="cert"><h2>👑 황제의부활 보물찾기</h2><h2>🤖 코코 보물 감정서</h2><hr><div style="font-size:55px;color:#a77b25">S</div><b>특급 (예시)</b><h2>1970년 500원</h2><p>예상 가치</p><h2>150,000 ~ 370,000원</h2><p class="sample">시연용 예시 결과입니다.</p></div><div class="actions"><button class="secondary" onclick="save('certificate',{title:'1970년 500원'});toast('마이보물에 저장했습니다')">감정서 저장</button><button class="light" onclick="share()">공유</button></div>${btn('보물 등록하기','register')}${btn('경매 등록하기','auctionRegister','secondary')}`;break;
case 'market':case 'auctions':{const a=page==='auctions';h=title(a?'보물경매':'보물장터')+btn(a?'경매 등록하기':'보물 등록하기',a?'auctionRegister':'register','secondary')+`<div class="scrolltabs">${['전체','동전','지폐','골동품','수집품'].map(x=>`<button onclick="filter='${x}';draw()">${x}</button>`).join('')}</div><div class="grid">${items(a?'경매':'보물').filter(x=>filter==='전체'||x.title.includes(filter)).map(card).join('')}</div>`;break}
case 'detail':case 'auctionDetail':{const a=page==='auctionDetail',x=selected;if(!x)return title('상품 없음');const bids=read('auction-bids-'+x.id,[]),highest=Math.max(Number(x.price)||0,...bids.map(b=>b.amount));h=title(a?'경매 상세':'보물 상세')+`<div class="card"><div class="pic" style="font-size:90px;text-align:center;max-height:320px;overflow:hidden">${x.photo&&x.photo.length>1000?photo(x):'🪙'}</div><h2>${esc(x.title)}</h2><p>${esc(x.desc||'')}</p><h2 class="price">${highest.toLocaleString()}원</h2><div class="actions"><button class="light" onclick="share()">공유하기</button><button class="secondary" onclick="go('messages')">거래 문의하기</button></div></div>${a?`<div class="card"><h3>입찰하기</h3><input class="field" type="number" id="bid" placeholder="입찰 금액"><button class="primary" onclick="bid()">입찰하기</button></div>`:btn('구매하기','checkout')}`;break}
case 'register':case 'auctionRegister':case 'hunterWrite':{type=page==='register'?'보물':page==='auctionRegister'?'경매':'헌터 의뢰';h=title(type+' 등록')+`<div class="card"><label>제목<input class="field" id="name" placeholder="제목 입력"></label><label>설명<textarea class="field" id="desc" placeholder="내용 입력"></textarea></label><label>가격/희망 금액<input class="field" id="price" type="number" placeholder="원"></label>${type==='헌터 의뢰'?'<label>지역<select class="field" id="region"><option>전국</option><option>서울</option><option>경기</option><option>인천</option><option>부산</option><option>대구</option><option>대전</option><option>광주</option><option>제주</option></select></label>':''}<label>사진 선택<input class="field" id="upload" type="file" accept="image/*"></label><button class="primary" onclick="saveItem()">등록하기</button></div>`;break}
case 'checkout':h=title('구매·결제')+`<div class="card"><h2>${esc(selected?.title)}</h2><p class="price">${Number(selected?.price||0).toLocaleString()}원</p><p class="sample">실제 결제는 연동되지 않았습니다.</p><button class="primary" onclick="save('purchases',[...read('purchases',[]),selected]);go('purchaseDone')">구매 체험 완료</button></div>`;break;
case 'purchaseDone':h=title('구매 완료')+`<div class="card"><h2>🎉 구매 체험 완료</h2>${btn('마이보물 확인','myTreasures')}</div>`;break;
case 'hunter':h=title('보물헌터')+`<div class="card"><h2>🔎 찾고 싶은 보물을 의뢰하세요</h2>${btn('의뢰게시판','hunterList')}${btn('보물 찾기 의뢰하기','hunterWrite','secondary')}</div>`;break;
case 'hunterList':h=title('보물헌터 의뢰게시판')+btn('✎ 의뢰 등록','hunterWrite')+read('헌터 의뢰',[]).map(x=>`<button class="light" onclick="openItem('헌터 의뢰','${x.id}')">${esc(x.title)} · ${esc(x.region)}</button>`).join('');break;
case 'hunterDetail':h=title('의뢰 상세')+`<div class="card"><h2>${esc(selected?.title)}</h2><p>${esc(selected?.desc)}</p>${btn('쪽지 보내기','messages')}</div>`;break;
case 'world':case 'worldList':case 'worldDetail':h=title('세계의 보물')+`<div class="card"><h2>🌏 세계의 보물</h2><p>세계의 보물 이야기와 참여 리스트</p>${btn('참여 리스트','worldList','secondary')}${btn('보물 상세','worldDetail','light')}${btn('거래 문의하기','messages')}</div>`;break;
case 'today':case 'event':h=title('오늘의 보물')+`<div class="card"><h2>🏆 오늘의 보물을 찾아라!</h2><p>운영자가 지정하는 이벤트입니다.</p>${btn('이벤트 상세','event')}</div>`;break;
case 'messages':h=title('쪽지함 · 거래 문의')+`<div class="card">${read('messages',[]).map(x=>`<div class="msg">${esc(x)}</div>`).join('')||'<p>쪽지가 없습니다.</p>'}<textarea class="field" id="message" placeholder="메시지 입력"></textarea><button class="primary" onclick="send()">➤ 전송</button><p class="muted">이 기기에서만 보관됩니다.</p></div>`;break;
case 'mypage':h=title('마이보물')+`<div class="card"><h2>👤 ${esc(read('nickname','게스트'))}</h2>${btn('카카오 / 구글로 시작하기','login','secondary')}</div><div class="grid">${[['마이보물','myTreasures'],['쪽지함','messages'],['내 포인트','points'],['문의 내역','inquiries'],['알림 설정','alerts'],['계정 설정','account']].map(([t,p])=>`<button class="light" onclick="go('${p}')">${t}</button>`).join('')}</div>`;break;
case 'myTreasures':h=title('마이보물')+`<div class="card"><h3>감정서</h3><p>${read('certificate',null)?'1970년 500원 감정서 저장됨':'저장한 감정서가 없습니다.'}</p>${btn('감정서 보기','certificate','light')}</div><h3>내 보물</h3><div class="grid">${read('보물',[]).map(x=>card({...x,type:'보물'})).join('')}</div><h3>구매 내역</h3>${read('purchases',[]).map(x=>`<p>${esc(x.title)}</p>`).join('')}`;break;
case 'login':h=title('시작하기')+`<div class="card"><p class="sample">실제 카카오/구글 인증은 아직 연동되지 않았습니다.</p><input class="field" id="nick" placeholder="닉네임"><button class="secondary" onclick="save('nickname',$('nick').value||'체험회원');go('mypage')">카카오로 시작하기 (체험)</button><button class="light" onclick="save('nickname',$('nick').value||'체험회원');go('mypage')">구글로 시작하기 (체험)</button></div>`;break;
case 'search':h=title('보물 검색')+`<input class="field" id="q" placeholder="보물 이름 검색" oninput="$('results').innerHTML=items('보물').concat(items('경매')).filter(x=>x.title.includes(this.value)).map(card).join('')"><div id="results" class="grid"></div>`;break;
case 'menu':h=title('전체 메뉴')+`<div class="grid">${[['촬영','front'],['장터','market'],['경매','auctions'],['헌터','hunter'],['세계의 보물','world'],['오늘의 보물','today'],['쪽지','messages'],['마이보물','mypage']].map(([t,p])=>`<button class="light" onclick="go('${p}')">${t}</button>`).join('')}</div>`;break;
case 'alerts':h=title('알림')+'<div class="card">새 알림이 없습니다.</div>';break;
case 'points':h=title('내 포인트')+'<div class="card">0 P</div>';break;
case 'inquiries':h=title('문의 내역')+btn('쪽지 보내기','messages');break;
case 'account':h=title('계정 설정')+btn('닉네임 변경','login');break;
default:h=title('페이지')+'<p>준비 중입니다.</p>'}return h}
function draw(){const p=page==='home'?home():layout(content());const nav=`<nav class="bottom">${[['home','⌂','홈'],['front','📷','보물촬영'],['market','▤','장터'],['auctions','⚒','경매'],['mypage','♙','마이보물']].map(([k,i,t])=>`<button class="${page===k?'active':''}" onclick="go('${k}')"><span>${i}</span>${t}</button>`).join('')}</nav>`;$('app').innerHTML=p+(page==='home'?'':nav)}const start=location.hash.slice(1);if(['home','front','market','auctions','hunter','mypage','world','today','messages'].includes(start))page=start;draw();
</script></body></html>
