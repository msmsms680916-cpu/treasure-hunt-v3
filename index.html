<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><title>황제의부활 보물찾기</title><style>
:root{--navy:#101d31;--blue:#233d5b;--gold:#cda85e;--cream:#fff9eb;--line:#e5e8ed}*{box-sizing:border-box}body{margin:0;background:#f5f6f9;color:#1a2940;font:15px/1.5 system-ui,-apple-system,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45}header{height:62px;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:space-between;padding:0 15px;position:sticky;top:0;z-index:10}.logo{border:0;background:none;color:var(--gold);font-weight:800;font-size:17px;white-space:nowrap;padding:0}.logo strong{font-size:22px}header .icons{display:flex;gap:6px}header .icons button{background:none;border:0;color:#f6e7bf;font-size:23px;padding:5px}.page{max-width:540px;margin:auto;padding:15px 14px 110px;min-height:calc(100vh - 62px)}.hero{border-radius:16px;background:linear-gradient(135deg,#142942,#2d4c69);color:#fff;padding:23px 20px;margin-bottom:15px}.hero h1{color:#f4d188;margin:6px 0;font-size:28px}.hero p{margin:4px 0;color:#e0e6ec}.hero small{color:#d7b87d}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;margin:12px 0;box-shadow:0 3px 10px #11233c09}.panel h2,.page h2{font-size:20px;margin:3px 0 12px}.panel h3{font-size:16px;margin:4px 0 10px}.muted{color:#728093;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{border:1px solid var(--line);background:#fff;border-radius:14px;padding:17px 10px;text-align:left;color:#233c5a;min-height:105px}.tile .emoji{display:block;font-size:28px;margin-bottom:6px}.tile b{display:block;font-size:17px}.tile small{display:block;color:#7d8997;font-size:12px}.primary,.secondary,.ghost{border:0;border-radius:11px;padding:13px 15px;font-weight:750}.primary{background:#243e60;color:white}.secondary{background:#e7d1a0;color:#392c18}.ghost{background:#eef1f6;color:#203953}.wide{width:100%;margin:7px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.row>*{min-width:0}.tabs{display:flex;gap:7px;overflow-x:auto;padding:4px 0 10px}.tabs button{white-space:nowrap;border:1px solid #d5dbe4;background:#fff;color:#263c57;border-radius:20px;padding:8px 13px}.tabs button.active{background:#243e60;color:white}.product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product{border:1px solid var(--line);border-radius:13px;background:#fff;overflow:hidden;text-align:left;color:inherit;padding:0}.photo{height:140px;background:#e9edf2;display:grid;place-items:center;overflow:hidden;font-size:46px}.photo img{width:100%;height:100%;object-fit:contain;box-shadow:none}.product .info{padding:10px}.product b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:42px}.price{font-size:18px;color:#ae5731;font-weight:800}.field{display:block;width:100%;padding:13px;border:1px solid #cbd2dc;border-radius:10px;background:white;color:#182d45;margin:8px 0 13px}textarea.field{min-height:90px;resize:vertical}.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--navy);display:flex;justify-content:space-around;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:9}.bottom button{border:0;background:none;color:#e8d8ae;display:grid;gap:1px;place-items:center;flex:1;font-size:12px;padding:4px 0}.bottom button span{font-size:22px}.bottom button.active{color:#fff;font-weight:900}.section-title{display:flex;align-items:center;justify-content:space-between;margin:13px 0}.section-title h2{margin:0}.link{border:0;background:none;color:#315f99;font-weight:700}.preview{max-width:100%;max-height:300px;display:block;margin:12px auto;object-fit:contain;border-radius:12px}.bigphoto{height:280px;border-radius:15px;background:#edf0f4;display:grid;place-items:center;overflow:hidden;font-size:70px}.bigphoto img{width:100%;height:100%;object-fit:contain}.cert{background:var(--cream);border:5px double #c8a057;padding:22px 14px;text-align:center;border-radius:10px}.cert h2{color:#74501c;font-size:23px}.cert .grade{font-size:42px;color:#b18b39;font-weight:900}.tag{font-size:12px;background:#f1e6c9;border-radius:12px;padding:3px 9px;color:#665029}.messages{max-height:50vh;overflow:auto;display:grid;gap:8px}.bubble{background:#e8eef7;padding:10px 12px;border-radius:12px;max-width:90%;justify-self:end;overflow-wrap:anywhere}.toast{position:fixed;top:74px;left:50%;transform:translateX(-50%);background:#263e5d;color:white;padding:12px 18px;border-radius:12px;z-index:30;display:none;max-width:90vw}.modal{position:fixed;inset:0;background:#0b1b2bd9;z-index:20;display:none;align-items:end;justify-content:center}.modal.open{display:flex}.sheet{background:white;border-radius:22px 22px 0 0;width:min(540px,100%);padding:18px;max-height:90vh;overflow:auto}.hint{background:#fff5df;color:#765725;padding:10px 12px;border-radius:9px;font-size:12px}.divider{border:0;border-top:1px solid #e4e7ed;margin:14px 0}.category{display:flex;gap:8px;overflow:auto;margin:14px 0}.category button{white-space:nowrap;border:1px solid #e2e4e8;border-radius:25px;background:white;padding:8px 14px}.mini{font-size:12px}.event{background:linear-gradient(135deg,#f9e9bb,#fff);border:1px solid #e3c88b;color:#66501e}.image-tile{width:100%;height:200px;object-fit:contain;background:#f6f3ed;border-radius:12px}.notice{font-size:12px;color:#8b6532}.empty{text-align:center;padding:30px 8px;color:#7a8794}#upload{display:none}@media(min-width:600px){.bottom{left:50%;transform:translateX(-50%);width:540px;border-radius:12px 12px 0 0}} </style></head><body><header><button class="logo" onclick="go('home')">황제의부활 <strong>보물찾기</strong></button><div class="icons"><button aria-label="검색" onclick="go('search')">⌕</button><button aria-label="알림" onclick="go('alerts')">♧</button><button aria-label="전체메뉴" onclick="go('menu')">☰</button></div></header><main id="app" class="page"></main><nav class="bottom" id="nav"></nav><div id="toast" class="toast"></div><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><script>
const KEY='treasure-demo-', read=(k,d)=>{try{return JSON.parse(localStorage.getItem(KEY+k))??d}catch{return d}},write=(k,v)=>{try{localStorage.setItem(KEY+k,JSON.stringify(v));return true}catch{toast('저장 공간이 부족합니다');return false}},esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const assets=['treasure-hunt-v3-starter/screens/01.jpg','treasure-hunt-v3-starter/screens/07.jpg'];
let page='home',historyStack=[],chosen=null,front=null,back=null,filter='전체',kind='보물',query='';const $=id=>document.getElementById(id);function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').style.display='none',2400)}function modal(html){$('sheet').innerHTML=html;$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}function go(p,remember=true){if(remember&&page!==p)historyStack.push(page);page=p;closeModal();render();window.scrollTo(0,0);location.hash=p}function backPage(){if(historyStack.length)go(historyStack.pop(),false);else go('home',false)}window.addEventListener('popstate',()=>backPage());function btn(t,p,cl='primary'){return `<button class="${cl}" onclick="go('${p}')">${t}</button>`}function head(t,sub=''){return `<div class="row"><button class="link" onclick="backPage()">← 뒤로</button><h2>${t}</h2><span></span></div>${sub?`<p class="muted">${sub}</p>`:''}`}
function nav(){let arr=[['home','⌂','홈'],['market','🏺','장터'],['auctions','🏆','경매'],['hunter','🔎','헌터'],['mypage','👤','마이']];$('nav').innerHTML=arr.map(([p,i,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><span>${i}</span>${t}</button>`).join('')}
function photo(item,cls='photo'){return `<div class="${cls}">${item.photo?`<img src="${item.photo}" alt="${esc(item.title)}">`:item.emoji||'🪙'}</div>`}
const samples=[{id:'s1',title:'1970년 500원 희귀 주화',price:150000,emoji:'🪙',desc:'수집용 동전',type:'보물'},{id:'s2',title:'한국은행 1,000원 (세종대왕)',price:120000,emoji:'💵',desc:'옛 지폐',type:'보물'},{id:'s3',title:'옛 도자기 수집품',price:85000,emoji:'🏺',desc:'도자기',type:'보물'},{id:'s4',title:'기념 메달 수집품',price:49000,emoji:'🏅',desc:'기념품',type:'보물'}];
const auctionSamples=[{id:'a1',title:'1966년 희귀 주화',price:170000,emoji:'🪙',desc:'경매 진행 중',type:'경매'},{id:'a2',title:'기념 주화 세트',price:80000,emoji:'🏅',desc:'경매 진행 중',type:'경매'}];
function items(type){return [...read(type,[]).map(x=>({...x,type})),...(type==='보물'?samples:type==='경매'?auctionSamples:[])]}
function productCard(x){return `<button class="product" onclick="detail('${x.type}','${String(x.id).replace(/'/g,'')}')">${photo(x)}<div class="info"><b>${esc(x.title)}</b><div class="muted">${esc(x.desc||'')}</div><div class="price">${Number(x.price||0).toLocaleString()}원</div></div></button>`}
function detail(type,id){chosen=items(type).find(x=>String(x.id)===id);if(!chosen)return toast('상품을 찾지 못했습니다');go(type==='경매'?'auctionDetail':type==='헌터 의뢰'?'hunterDetail':'detail')}
function photoPicker(side){modal(`<h2>${side==='front'?'앞면':'뒷면'} 사진 선택</h2><p class="muted">카메라로 촬영하거나 앨범에서 선택하세요.</p><label class="primary wide" style="display:block;text-align:center">📷 촬영 / 앨범 선택<input id="pick" type="file" accept="image/*" style="display:none"></label><img id="pickPreview" class="preview"><button class="primary wide" id="confirmPhoto" disabled>사진 확인</button><button class="ghost wide" onclick="closeModal()">취소</button>`);$('pick').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{let c=document.createElement('canvas'),s=Math.min(1,900/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);let url=c.toDataURL('image/jpeg',.7);if(side==='front')front=url;else back=url;$('pickPreview').src=url;$('confirmPhoto').disabled=false};im.src=r.result};r.readAsDataURL(f)};$('confirmPhoto').onclick=()=>go(side==='front'?'frontConfirm':'backConfirm')}
function render(){nav();let h='';switch(page){
case 'home':h=`<div class="hero"><small>황제의부활</small><h1>보물찾기</h1><p>작은 보물 하나가 큰 가치를 만듭니다.</p></div><button class="panel wide" style="text-align:left;border:2px solid #d9bd80;background:#fff9eb" onclick="go('front')"><h2>📸 보물 촬영하기 →</h2><p class="muted">앞면과 뒷면을 촬영하고 코코 AI 감정 과정을 체험하세요.</p></button><div class="category"><button onclick="go('market')">🪙 동전</button><button onclick="go('market')">💵 지폐</button><button onclick="go('market')">🏺 골동품</button><button onclick="go('market')">🏅 수집품</button></div><div class="grid"><button class="tile" onclick="go('market')"><span class="emoji">🏺</span><b>보물장터</b><small>보물 거래하기</small></button><button class="tile" onclick="go('auctions')"><span class="emoji">🏆</span><b>경매하기</b><small>입찰 및 경매 등록</small></button><button class="tile" onclick="go('world')"><span class="emoji">🌍</span><b>세계의 보물</b><small>세계의 보물 탐험</small></button><button class="tile" onclick="go('hunter')"><span class="emoji">🔎</span><b>보물헌터</b><small>보물 의뢰 게시판</small></button></div><div class="panel event" onclick="go('today')"><h2>✨ 오늘의 보물을 찾아라 →</h2><p>오늘의 이벤트를 확인하세요.</p></div><div class="section-title"><h2>세계의 보물</h2><button class="link" onclick="go('world')">더보기 ›</button></div><div class="panel" onclick="go('world')">🌍 세계 곳곳의 특별한 보물을 만나보세요.</div><div class="section-title"><h2>오늘의 보물</h2><button class="link" onclick="go('today')">더보기 ›</button></div><div class="panel" onclick="go('today')">🏆 오늘의 보물 이벤트 참여하기</div>`;break;
case 'front':case 'back':h=head(page==='front'?'보물 앞면 촬영':'보물 뒷면 촬영','촬영 또는 앨범에서 사진을 선택할 수 있습니다.')+`<div class="panel"><div class="bigphoto">${page==='front'?'🪙':'📷'}</div><button class="primary wide" onclick="photoPicker('${page}')">📷 촬영 / 앨범에서 선택</button></div>`;break;
case 'frontConfirm':case 'backConfirm':{let isFront=page==='frontConfirm',src=isFront?front:back;h=head(isFront?'앞면 사진 확인':'뒷면 사진 확인')+`<div class="panel">${src?`<img class="preview" src="${src}">`:'<p>사진이 없습니다.</p>'}<button class="ghost wide" onclick="go('${isFront?'front':'back'}')">다시 촬영하기</button>${btn(isFront?'뒷면 촬영하기':'AI 감정하기',isFront?'back':'analyzing','primary wide')}</div>`;break}
case 'analyzing':h=head('코코 AI 감정 분석')+`<div class="panel" style="text-align:center"><div style="font-size:70px">🤖</div><h2>코코가 보물을 살펴보고 있어요</h2><p>감정 중 · 시세 분석 중 · 상태 분석 중</p><progress style="width:100%;accent-color:#cba454" max="100" value="100"></progress><p class="hint">현재는 투자자 체험용 예시 감정입니다. 실제 AI 분석 결과가 아닙니다.</p>${btn('감정서 확인하기','certificate','primary wide')}</div>`;break;
case 'certificate':h=head('AI 감정서')+`<div class="cert"><div style="font-size:56px">🤖</div><h2>황제의부활 보물찾기</h2><h3>코코 보물 감정서</h3><hr><div class="grade">S</div><b>특급 · 예시 등급</b><p>1970년 500원</p><p class="muted">수집품 감정 예시</p><h3>예상 가치</h3><h2>150,000 ~ 370,000원</h2><p class="notice">실제 AI 감정·시세 조회가 아닌 시연용 예시입니다.</p></div><div class="grid" style="margin-top:12px"><button class="secondary" onclick="saveCertificate()">감정서 저장</button><button class="ghost" onclick="share()">공유하기</button></div>${btn('보물 등록하기','register','primary wide')}${btn('경매 등록하기','auctionRegister','secondary wide')}`;break;
case 'market':case 'auctions':{let isAuction=page==='auctions',type=isAuction?'경매':'보물';h=head(isAuction?'경매하기':'보물장터')+`<div class="row"><p class="muted">${isAuction?'진행 중인 경매를 확인하세요.':'보물을 둘러보고 거래 문의를 보내세요.'}</p><button class="secondary" onclick="go('${isAuction?'auctionRegister':'register'}')">＋ 등록</button></div><div class="tabs">${['전체','동전','지폐','골동품','수집품'].map(t=>`<button class="${filter===t?'active':''}" onclick="filter=${JSON.stringify(t)};render()">${t}</button>`).join('')}</div><div class="product-grid">${items(type).filter(x=>filter==='전체'||(filter==='동전'&&/동전|주화/.test(x.title))||(filter==='지폐'&&/지폐|1,000원/.test(x.title))||(filter==='골동품'&&/도자기|골동/.test(x.title))||(filter==='수집품'&&/수집|메달/.test(x.title))).map(productCard).join('')||'<p class="muted">해당 상품이 없습니다.</p>'}</div>`;break}
case 'detail':case 'auctionDetail':{let x=chosen;if(!x){go('market');return}let a=page==='auctionDetail',bids=read('auction-bids-'+x.id,[]),highest=Math.max(Number(x.price)||0,...bids.map(v=>Number(v.amount)||0));h=head(a?'경매 상세':'상품 상세')+`<div class="panel">${photo(x,'bigphoto')}<h2>${esc(x.title)}</h2><p>${esc(x.desc||'')}</p><p class="muted">${a?'현재 최고 입찰가':'판매 가격'}</p><div class="price">${highest.toLocaleString()}원</div><hr class="divider"><div class="row"><button class="ghost" onclick="share()">↗ 공유하기</button><button class="ghost" onclick="go('messages')">✉ 거래 문의하기</button></div></div>${a?`<div class="panel"><h3>입찰하기</h3><input class="field" type="number" id="bid" placeholder="입찰 금액 (원)" min="1"><button class="primary wide" onclick="placeBid()">입찰하기</button><p class="muted">이 기기의 시연 기록에만 저장됩니다.</p></div>`:`<button class="primary wide" onclick="go('checkout')">구매하기</button>`}`;break}
case 'register':case 'auctionRegister':case 'hunterWrite':{kind=page==='register'?'보물':page==='auctionRegister'?'경매':'헌터 의뢰';h=head(kind+' 등록')+`<div class="panel"><label>제목<input class="field" id="title" placeholder="${kind} 제목을 입력하세요"></label><label>설명<textarea class="field" id="desc" placeholder="내용을 입력하세요"></textarea></label><label>${kind==='헌터 의뢰'?'희망 금액':'가격'} (원)<input class="field" type="number" id="price" placeholder="금액"></label>${kind==='헌터 의뢰'?'<label>지역<select id="region" class="field"><option>전국</option><option>서울</option><option>경기</option><option>인천</option><option>부산</option><option>대구</option><option>대전</option><option>광주</option><option>울산</option><option>강원</option><option>충청</option><option>전라</option><option>경상</option><option>제주</option></select></label>':''}<label>사진 선택<input class="field" type="file" accept="image/*" id="itemPhoto"></label><button class="primary wide" onclick="saveEntry()">${kind} 등록하기</button></div>`;break}
case 'checkout':h=head('구매 및 결제')+`<div class="panel"><h3>${esc(chosen?.title||'선택한 보물')}</h3><p class="price">${Number(chosen?.price||0).toLocaleString()}원</p><p class="hint">실제 결제 서비스는 연결되지 않았습니다. 아래 버튼은 시연용 구매 기록만 저장합니다.</p><button class="primary wide" onclick="write('purchases',[...(read('purchases',[])),chosen]);go('purchaseDone')">시연용 구매 완료</button></div>`;break;
case 'purchaseDone':h=head('구매 완료')+`<div class="panel" style="text-align:center"><div style="font-size:60px">🎉</div><h2>구매 체험이 완료되었습니다.</h2><p class="muted">실제 결제나 배송은 발생하지 않습니다.</p>${btn('마이보물 확인하기','myTreasures','primary wide')}</div>`;break;
case 'hunter':h=head('보물헌터')+`<div class="hero"><h1>🔎 보물헌터</h1><p>찾고 싶은 보물을 의뢰하고 이야기를 나누세요.</p></div>${btn('의뢰게시판 보기','hunterList','primary wide')}${btn('보물 찾기 의뢰하기','hunterWrite','secondary wide')}`;break;
case 'hunterList':h=head('보물헌터 의뢰게시판')+`<button class="secondary wide" onclick="go('hunterWrite')">✎ 의뢰 글쓰기</button>${read('헌터 의뢰',[]).map(x=>`<button class="panel wide" style="text-align:left" onclick="detail('헌터 의뢰','${x.id}')"><b>${esc(x.title)}</b><p class="muted">${esc(x.region||'전국')} · ${esc(x.desc)}</p></button>`).join('')||'<div class="panel empty">등록된 의뢰가 없습니다. 첫 번째 의뢰를 작성해 보세요.</div>'}`;break;
case 'hunterDetail':h=head('보물헌터 의뢰 상세')+`<div class="panel">${photo(chosen,'bigphoto')}<h2>${esc(chosen?.title)}</h2><p>${esc(chosen?.desc)}</p><p>지역: ${esc(chosen?.region||'전국')}</p><button class="primary wide" onclick="go('messages')">✉ 쪽지 보내기</button></div>`;break;
case 'world':h=head('세계의 보물')+`<div class="hero"><h1>🌍 세계의 보물</h1><p>세계 곳곳의 보물 이야기를 만나보세요.</p></div>${btn('참여 리스트 보기','worldList','primary wide')}`;break;
case 'worldList':h=head('세계의 보물 · 참여 리스트')+`<button class="panel wide" onclick="go('worldDetail')"><h2>🌏 세계의 보물 이야기</h2><p>자세히 보기 →</p></button>`;break;
case 'worldDetail':h=head('세계의 보물 상세')+`<div class="panel"><h2>🌏 세계의 보물</h2><p>세계의 보물과 수집품에 대한 이야기를 나눠보세요.</p><button class="primary wide" onclick="go('messages')">거래 문의하기</button></div>`;break;
case 'today':h=head('오늘의 보물')+`<div class="panel event"><h2>🏆 오늘의 보물을 찾아라!</h2><p>운영자가 지정한 이벤트를 소개하는 시연 페이지입니다.</p><button class="primary wide" onclick="go('event')">이벤트 상세 보기</button></div>`;break;
case 'event':h=head('이벤트 상세')+`<div class="panel"><h2>✨ 오늘의 보물 이벤트</h2><p>운영자 이벤트 예시입니다. 실제 이벤트 기간 및 상품은 운영 시 변경됩니다.</p><button class="secondary wide" onclick="toast('시연용 이벤트입니다')">이벤트 참여하기</button></div>`;break;
case 'messages':h=head('쪽지함 · 거래 문의')+`<div class="panel"><div class="messages">${read('messages',[]).map(m=>`<div class="bubble">${esc(typeof m==='string'?m:m.text)}</div>`).join('')||'<p class="muted">아직 쪽지가 없습니다.</p>'}</div><textarea id="msg" class="field" placeholder="메시지 입력"></textarea><button class="primary wide" onclick="sendMessage()">➤ 전송</button><p class="muted">메시지는 이 기기에만 저장됩니다.</p></div>`;break;
case 'mypage':h=head('마이페이지')+`<div class="panel"><h2>👤 ${esc(read('nickname','게스트'))}</h2><button class="secondary wide" onclick="go('login')">${read('nickname',null)?'회원 정보 변경':'카카오 / 구글로 시작하기'}</button></div><div class="grid"><button class="tile" onclick="go('myTreasures')">🪙<b>마이보물</b></button><button class="tile" onclick="go('messages')">✉<b>쪽지함</b></button><button class="tile" onclick="go('points')">💰<b>내 포인트</b></button><button class="tile" onclick="go('inquiries')">📋<b>문의 내역</b></button><button class="tile" onclick="go('alerts')">🔔<b>알림 설정</b></button><button class="tile" onclick="go('account')">⚙<b>계정 설정</b></button></div>`;break;
case 'myTreasures':h=head('마이보물')+`<div class="panel"><h3>저장한 감정서</h3><p>${read('certificate',null)?'📜 코코 감정서 · 1970년 500원':'저장된 감정서가 없습니다.'}</p>${read('certificate',null)?btn('감정서 보기','certificate','ghost wide'):''}</div><h3>등록한 보물</h3><div class="product-grid">${read('보물',[]).map(x=>productCard({...x,type:'보물'})).join('')||'<p class="muted">등록 내역 없음</p>'}</div><h3>구매 기록</h3><div class="panel">${read('purchases',[]).map(x=>`<p>${esc(x.title)}</p>`).join('')||'구매 기록 없음'}</div>`;break;
case 'login':h=head('시작하기')+`<div class="panel"><h2>보물찾기에 오신 것을 환영합니다.</h2><p class="hint">카카오·구글 실인증은 아직 연동되지 않았습니다. 시연용 닉네임으로 시작할 수 있습니다.</p><input class="field" id="nick" placeholder="닉네임 입력"><button class="secondary wide" onclick="saveNick()">카카오로 시작하기 (체험)</button><button class="ghost wide" onclick="saveNick()">구글로 시작하기 (체험)</button></div>`;break;
case 'search':h=head('보물 검색')+`<input id="searchInput" class="field" placeholder="보물 이름 검색" value="${esc(query)}" oninput="query=this.value;searchResults()"><div id="results"></div>`;break;
case 'menu':h=head('전체 메뉴')+`<div class="grid">${[['보물 촬영','front'],['보물장터','market'],['경매하기','auctions'],['세계의 보물','world'],['보물헌터','hunter'],['오늘의 보물','today'],['마이페이지','mypage'],['쪽지함','messages']].map(([t,p])=>`<button class="tile" onclick="go('${p}')"><b>${t} →</b></button>`).join('')}</div>`;break;
case 'alerts':h=head('알림')+`<div class="panel"><p>🔔 새로운 알림이 없습니다.</p><label><input type="checkbox" checked> 알림 받기 (이 기기 체험 설정)</label></div>`;break;
case 'points':h=head('내 포인트')+`<div class="panel"><h2>0 P</h2><p class="muted">포인트 연동 전입니다.</p></div>`;break;
case 'inquiries':h=head('문의 내역')+`<div class="panel"><p>문의 내역이 없습니다.</p>${btn('쪽지 작성하기','messages','primary wide')}</div>`;break;
case 'account':h=head('계정 설정')+`<div class="panel"><p>닉네임: ${esc(read('nickname','게스트'))}</p>${btn('닉네임 변경','login','ghost wide')}</div>`;break;
default:h=head('페이지')+'<div class="panel">준비 중입니다.</div>'}
$('app').innerHTML=h;if(page==='search')searchResults()}
function searchResults(){let el=$('results');if(!el)return;let arr=[...items('보물'),...items('경매')].filter(x=>x.title.toLowerCase().includes(query.toLowerCase()));el.innerHTML=`<div class="product-grid">${arr.map(productCard).join('')}</div>`}
function saveCertificate(){write('certificate',{date:Date.now(),title:'1970년 500원'});toast('감정서가 마이보물에 저장되었습니다')}
function share(){if(navigator.share)navigator.share({title:'황제의부활 보물찾기',url:location.href}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(location.href).then(()=>toast('링크가 복사되었습니다'));else toast('공유 기능을 사용할 수 없습니다')}
function sendMessage(){let v=$('msg')?.value.trim();if(!v)return toast('메시지를 입력하세요');write('messages',[...read('messages',[]),v]);render();toast('쪽지가 저장되었습니다')}
function saveNick(){write('nickname',$('nick').value.trim()||'체험 회원');go('mypage')}
function placeBid(){let amt=Number($('bid')?.value),bids=read('auction-bids-'+chosen.id,[]),highest=Math.max(Number(chosen.price)||0,...bids.map(x=>Number(x.amount)||0));if(!Number.isFinite(amt)||amt<=highest)return toast('현재가보다 높은 금액을 입력하세요');write('auction-bids-'+chosen.id,[...bids,{amount:amt,date:Date.now()}]);toast('입찰 체험이 기록되었습니다');render()}
function saveEntry(){let title=$('title').value.trim();if(!title)return toast('제목을 입력하세요');let obj={id:Date.now(),title,desc:$('desc').value.trim(),price:Number($('price').value)||0,region:$('region')?.value||'전국',photo:''};let f=$('itemPhoto').files[0];const done=()=>{write(kind,[obj,...read(kind,[])]);filter='전체';go(kind==='보물'?'market':kind==='경매'?'auctions':'hunterList');toast('등록 완료 · 목록에서 확인하세요')};if(!f)return done();let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),r=Math.min(1,700/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*r));c.height=Math.max(1,Math.round(im.height*r));c.getContext('2d').drawImage(im,0,0,c.width,c.height);obj.photo=c.toDataURL('image/jpeg',.65);done()};im.onerror=done;im.src=reader.result};reader.onerror=done;reader.readAsDataURL(f)}
$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};render();
</script></body></html>
